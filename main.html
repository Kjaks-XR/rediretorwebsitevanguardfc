<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
body {
    margin: 0;
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}
.loader {
    width: 80px;
    height: 80px;
    border: 8px solid #222;
    border-top: 8px solid #00ffcc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}
</style>
</head>
<body>
<div class="loader"></div>
<iframe id="site" src="https://e917-85-103-57-6.ngrok-free.app"></iframe>
<script>
setTimeout(function() {
    document.querySelector(".loader").style.display = "none";
    var frame = document.getElementById("site");
    frame.style.display = "block";
}, 4000);
</script>
</body>
</html>
